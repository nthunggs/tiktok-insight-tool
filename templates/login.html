<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Tiktok Insight V1</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23000' d='M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { font-family: 'Inter', system-ui, sans-serif; }
    body { -webkit-font-smoothing: antialiased; }

    .bg-mesh {
      background:
        radial-gradient(at 18% 22%, hsl(280 90% 70% / .35) 0px, transparent 50%),
        radial-gradient(at 82% 18%, hsl(200 95% 65% / .35) 0px, transparent 50%),
        radial-gradient(at 50% 88%, hsl(335 90% 70% / .35) 0px, transparent 50%),
        radial-gradient(at 88% 88%, hsl(40 95% 65% / .30) 0px, transparent 50%),
        hsl(240 30% 96%);
    }

    .card-blur {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        0 24px 60px -20px rgba(80, 30, 160, 0.18),
        0 8px 24px -12px rgba(80, 30, 160, 0.1);
    }

    .input {
      width: 100%; padding: 11px 14px;
      font-size: 14px; background: white;
      border: 1.5px solid hsl(240 5.9% 90%);
      border-radius: 10px; transition: border-color .15s, box-shadow .15s;
    }
    .input:focus {
      outline: none;
      border-color: hsl(263 84% 60%);
      box-shadow: 0 0 0 4px hsl(263 84% 60% / .15);
    }

    .btn-primary {
      background: linear-gradient(135deg, hsl(263 84% 60%), hsl(239 84% 60%));
      color: white;
      box-shadow: 0 8px 20px -6px hsl(263 84% 60% / .55);
    }
    .btn-primary:hover { box-shadow: 0 12px 26px -6px hsl(263 84% 60% / .6); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-lark {
      background: white; color: hsl(240 10% 16%);
      border: 1.5px solid hsl(240 5.9% 88%);
    }
    .btn-lark:hover:not(:disabled) {
      background: hsl(0 0% 99%);
      border-color: hsl(239 84% 60%);
      box-shadow: 0 4px 12px -4px hsl(239 84% 60% / .3);
    }
    .btn-lark:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-5">

  <div class="w-full max-w-md">

    <!-- Logo & header -->
    <div class="text-center mb-7">
      <!-- TikTok logo big -->
      <div class="relative inline-flex items-center justify-center w-16 h-16 mb-4">
        <svg viewBox="0 0 24 24" class="absolute w-14 h-14" style="color:#25F4EE; transform: translate(-3px, 2px); mix-blend-mode: screen;">
          <path fill="currentColor" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1Z"/>
        </svg>
        <svg viewBox="0 0 24 24" class="absolute w-14 h-14" style="color:#FE2C55; transform: translate(3px, -2px); mix-blend-mode: screen;">
          <path fill="currentColor" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1Z"/>
        </svg>
        <svg viewBox="0 0 24 24" class="relative w-14 h-14" style="filter: drop-shadow(0 8px 20px rgba(0,0,0,.15))">
          <path fill="#000" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1Z"/>
        </svg>
      </div>
      <h1 class="text-[24px] font-bold tracking-tight text-gray-900">Tiktok Insight V1</h1>
      <p class="text-[13px] text-gray-500 mt-1">Đăng nhập để tiếp tục</p>
    </div>

    <!-- Login card -->
    <div class="card-blur rounded-2xl p-7">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-[12px] font-semibold text-gray-700 mb-1.5">Email</label>
          <input id="email" type="email" required class="input" placeholder="you@example.com" autocomplete="username" />
        </div>
        <div>
          <label class="block text-[12px] font-semibold text-gray-700 mb-1.5">Password</label>
          <input id="password" type="password" required class="input" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div id="err" class="hidden text-[12px] text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></div>

        <button type="submit" id="loginBtn"
                class="btn-primary w-full py-3 rounded-xl text-[14px] font-semibold transition-all flex items-center justify-center gap-2">
          <span id="btnLabel">Đăng nhập</span>
          <svg id="btnSpin" class="hidden animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2.5" stroke-opacity="0.3"/>
            <path d="M22 12a10 10 0 0 0-10-10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-[11px] text-gray-400 font-medium uppercase tracking-wider">Hoặc</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Lark OAuth -->
      {% if lark_enabled %}
      <a href="/auth/lark/login"
         class="btn-lark w-full py-3 rounded-xl text-[14px] font-semibold transition-all flex items-center justify-center gap-2.5">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <defs><linearGradient id="larkG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d6b9"/><stop offset="100%" stop-color="#3370ff"/></linearGradient></defs>
          <path fill="url(#larkG)" d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm-1.5 5L6 11.5l4.5 4.5L15 11.5 10.5 7z"/>
        </svg>
        Đăng nhập với Lark
      </a>
      {% else %}
      <button disabled
              class="btn-lark w-full py-3 rounded-xl text-[14px] font-semibold flex items-center justify-center gap-2.5">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#9ca3af">
          <path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm-1.5 5L6 11.5l4.5 4.5L15 11.5 10.5 7z"/>
        </svg>
        Lark OAuth (chưa cấu hình)
      </button>
      <p class="text-[10.5px] text-gray-400 text-center mt-2">Set <code class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">LARK_APP_ID</code> + <code class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">LARK_APP_SECRET</code> để bật</p>
      {% endif %}

    </div>

    <p class="text-center text-[11px] text-gray-400 mt-6">
      Internal tool · Tiktok Insight V1
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('err');
    const btn = document.getElementById('loginBtn');
    const btnLabel = document.getElementById('btnLabel');
    const btnSpin = document.getElementById('btnSpin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      btn.disabled = true; btnLabel.textContent = 'Đang xử lý…'; btnSpin.classList.remove('hidden');
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Đăng nhập thất bại';
          errBox.classList.remove('hidden');
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        errBox.textContent = 'Lỗi kết nối: ' + e.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false; btnLabel.textContent = 'Đăng nhập'; btnSpin.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
